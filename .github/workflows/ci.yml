name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows carries the full range: it is this package's primary
          # platform, and every failure found so far — the 8.3 short path,
          # the blocked console-script launcher — has been Windows-specific.
          # Testing it on one version only would not have caught them.
          - {os: windows-latest, python-version: "3.10"}
          - {os: windows-latest, python-version: "3.11"}
          - {os: windows-latest, python-version: "3.12"}
          - {os: windows-latest, python-version: "3.13"}
          - {os: windows-latest, python-version: "3.14"}
          - {os: ubuntu-latest, python-version: "3.10"}
          - {os: ubuntu-latest, python-version: "3.11"}
          - {os: ubuntu-latest, python-version: "3.12"}
          - {os: ubuntu-latest, python-version: "3.13"}
          - {os: ubuntu-latest, python-version: "3.14"}
          # macOS is claimed as supported, so it is exercised on one version
          # rather than left to assumption.
          - {os: macos-latest, python-version: "3.12"}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package
        run: python -m pip install -e ".[all]"

      # The suite is offline: it builds synthetic dictionaries and fixed-width
      # files in a temporary directory and never contacts IBGE.
      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check the command line entry point
        run: pnadc --version

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build

      - name: Verify package metadata
        run: python -m twine check dist/*

      # A release tag that disagrees with the version in the code would
      # publish something other than what the tag claims. Fail before that
      # can reach PyPI, where a version number can never be reused.
      - name: Check the built version matches the release tag
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.tar.gz | sed -E 's/.*-([0-9][^-]*)\.tar\.gz/\1/')
          echo "release tag: $tag / built version: $built"
          if [ "$tag" != "$built" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match built version $built"
            exit 1
          fi

      # An editable checkout hides packaging mistakes: a module left out of
      # the wheel, or an entry point that does not resolve once installed.
      - name: Install the built wheel in a clean environment and use it
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/python -m pip install --quiet dist/*.whl
          cd /tmp   # leave the source tree so the checkout cannot satisfy imports
          /tmp/wheelcheck/bin/python -c "import pnadc_https; print(pnadc_https.__version__)"
          /tmp/wheelcheck/bin/python -m pnadc_https --version
          /tmp/wheelcheck/bin/pnadc --version

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: distribution
          path: dist/

  publish:
    name: Publish to PyPI
    # Only when a GitHub Release is published, and only once the full matrix
    # has passed. Publishing is irreversible: a version cannot be re-uploaded
    # to PyPI even after being deleted.
    if: github.event_name == 'release'
    needs: [test, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pnadc-https
    permissions:
      # Required for Trusted Publishing: GitHub mints a short-lived OIDC
      # token that PyPI verifies, so there is no API token to store or leak.
      id-token: write
    steps:
      - name: Download the distribution built above
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: distribution
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
