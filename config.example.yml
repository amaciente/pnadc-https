# Paths are resolved relative to this configuration file.
archive: .
parquet: parquet
csv: csv

# Path fragments to skip everywhere: download, catalog, and conversion.
# Projecoes_Anteriores holds population projections superseded by later
# revisions. IBGE keeps them so previously published figures can be
# reproduced; they are not current microdata and are 44% of the archive by
# size. Set to [] to mirror everything, or pass --include-superseded for a
# single run.
exclude:
  - Projecoes_Anteriores

base_urls:
  trimestral: https://ftp.ibge.gov.br/Trabalho_e_Rendimento/Pesquisa_Nacional_por_Amostra_de_Domicilios_continua/Trimestral/Microdados/
  anual: https://ftp.ibge.gov.br/Trabalho_e_Rendimento/Pesquisa_Nacional_por_Amostra_de_Domicilios_continua/Anual/Microdados/

network:
  connect_timeout: 20
  read_timeout: 120
  retries: 4
  workers: 4
  chunk_size: 1048576
  user_agent: pnadc/0.4.0

